<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Models - GeoMind</title>
    <link rel="icon" type="image/png" href="../assets/img/geomind-logo.png" />
    <link rel="stylesheet" href="../assets/css/styles.css" />
  </head>
  <body>
    <header class="site-header">
      <button class="menu-button" type="button" aria-label="Open navigation">
        <span></span>
      </button>
      <a class="brand" href="../" aria-label="GeoMind home">
        <img src="../assets/img/geomind-logo.png" alt="" />
        <span>GeoMind</span>
      </a>
      <nav class="main-nav" aria-label="Main navigation">
        <a class="is-active" href="./" aria-current="page">Models</a>
        <a href="../datasets-benchmarks/">Datasets &amp; Benchmarks</a>
        <a href="../papers/">Papers</a>
      </nav>
    </header>
    <main class="list-page">
      <h1 class="visually-hidden" id="models-title">Models</h1>

      <section class="content-section" aria-label="GeoAI model cards">
        <div class="resource-controls" data-resource-list>
          <label class="search-control">
            <span class="visually-hidden">Search models</span>
            <input type="search" placeholder="Search models" data-resource-search />
          </label>
          <div class="sort-control" aria-label="Sort models">
            <span>Sort</span>
            <button class="is-active" type="button" data-sort-order="new" aria-pressed="true">
              New
            </button>
            <button type="button" data-sort-order="old" aria-pressed="false">Old</button>
          </div>
        </div>
        <div class="resource-table-wrap">
          <table class="resource-table">
            <thead>
              <tr>
                <th scope="col">Model name</th>
                <th scope="col">Category</th>
                <th scope="col">Venue / Year</th>
                <th scope="col"><span class="visually-hidden">Link</span></th>
              </tr>
            </thead>
            <tbody>
              <tr data-year="2025">
                <td>AlphaEarth Foundations</td>
                <td>Foundation Model</td>
                <td>2025</td>
                <td><a href="alphaearth/">View model card</a></td>
              </tr>
            </tbody>
          </table>
        </div>
      </section>
    </main>
    <script src="../assets/js/tabs.js"></script>
  </body>
</html>
