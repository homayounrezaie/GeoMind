<!DOCTYPE html>
<html lang="en">
<head>

<title>Datasets — GeoMind</title>
<link rel="stylesheet" href="../src/styles/landing.css?v=20260521-21">
</head>
<body class="category-page catalog-page" data-catalog="datasets">
<nav class="category-nav" aria-label="Breadcrumb">
  <div class="category-crumb">
    <a href="../index.html">GeoMind</a>
    <span>/</span>
    <span>Datasets</span>
  </div>
  <a class="category-nav-map" href="app.html">Open Knowledge Map</a>
</nav>
<main class="category-shell catalog-shell">
  <section class="catalog-hero">
    <div>
      <p class="category-label" data-catalog-label>Dataset Index</p>
      <h1 class="category-title" data-catalog-title>Datasets</h1>
      <p class="catalog-intro" data-catalog-intro>Loading datasets...</p>
    </div>
    <div class="catalog-summary" aria-label="Catalog summary">
      <div><strong data-catalog-count>0</strong><span>records</span></div>

      <div><strong data-catalog-secondary>0 linked records</strong><span>coverage</span></div>

  <section class="catalog-toolbar" aria-label="Catalog controls">
    <input data-catalog-search type="search" autocomplete="off" spellcheck="false" placeholder="Search datasets...">
    <div class="catalog-filters" data-catalog-filters></div>
  </section>
  <div class="catalog-resultbar">
    <span data-catalog-status>Loading results</span>
  </div>
  <section class="catalog-list" data-catalog-list aria-live="polite"></section>
  <button class="catalog-more" data-catalog-more type="button">Load more</button>

<script type="module" src="../src/js/catalog-pages.js"></script>
