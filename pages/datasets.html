<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Datasets &amp; Benchmarks - GeoMind</title>
    <link rel="icon" type="image/png" href="../images/geomind-logo.png" />
    <link rel="stylesheet" href="../css/style.css?v=20260610-29" />
  </head>
  <body>
    <header class="site-header resource-site-header">
      <button class="menu-button" type="button" aria-label="Open navigation">
        <span></span>
      </button>
      <a class="brand" href="../" aria-label="GeoMind home">
        <img src="../images/geomind-logo.png" alt="" />
        <span>GeoMind</span>
      </a>
      <nav class="main-nav" aria-label="Main navigation">
        <a href="models.html">Models</a>
        <a class="is-active" href="datasets.html" aria-current="page">Datasets &amp; Benchmarks</a>
        <a href="papers.html">Papers with Code</a>
      </nav>
      <a class="submit-resource-button header-submit-button" href="https://github.com/homayounrezaie/GeoMind/issues/new" target="_blank" rel="noreferrer" aria-label="Submit a dataset or benchmark" data-tooltip="Submit a dataset or benchmark">Submit</a>
    </header>

    <main class="list-page">
      <h1 class="visually-hidden" id="datasets-title">Datasets &amp; Benchmarks</h1>

      <section class="content-section" aria-label="GeoAI dataset and benchmark cards">
        <div class="resource-controls combined-controls" data-combined-resource-controls>
          <label class="filter-control">
            <span class="visually-hidden">Filter by resource type</span>
            <select data-resource-type-filter>
              <option value="all">Datasets &amp; Benchmarks</option>
              <option value="dataset">Datasets</option>
              <option value="benchmark">Benchmarks</option>
            </select>
          </label>
          <label class="search-control">
            <span class="visually-hidden">Search datasets and benchmarks</span>
            <input type="search" placeholder="Search datasets and benchmarks" data-resource-search />
          </label>
        </div>
        <div class="resource-table-wrap">
          <table class="resource-table resource-table-combined" data-combined-resource-table data-datasets-src="../data/datasets.json" data-benchmarks-src="../data/benchmarks.json">
            <thead>
              <tr>
                <th scope="col">Name</th>
                <th scope="col">Type</th>
                <th scope="col">Task</th>
                <th scope="col">Detail</th>
                <th scope="col"><span class="visually-hidden">Link</span></th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
      </section>
    </main>
    <script src="../js/site.js?v=20260610-27"></script>
  </body>
</html>
