<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Papers with Code - GeoMind</title>
    <link rel="icon" type="image/png" href="../images/geomind-logo.png" />
    <link rel="stylesheet" href="../css/style.css?v=20260612-8" />
  </head>
  <body>
    <header class="site-header resource-site-header">
      <button class="menu-button" type="button" aria-label="Open navigation">
        <span></span>
      </button>
      <a class="brand" href="../" aria-label="GeoMind home">
        <img src="../images/geomind-logo.png" alt="" />
        <span>GeoMind</span>
      </a>
      <nav class="main-nav" aria-label="Main navigation">
        <a href="models.html">Models</a>
        <a href="datasets.html">Datasets &amp; Benchmarks</a>
        <a class="is-active" href="papers.html" aria-current="page">Papers with Code</a>
      </nav>
      <a class="submit-resource-button header-submit-button" href="https://github.com/homayounrezaie/GeoMind/issues/new" target="_blank" rel="noreferrer" aria-label="Submit a paper with code" data-tooltip="Submit a paper with code" data-submit-modal-trigger data-submit-kind="paper">Submit</a>
    </header>

    <main class="list-page">
      <h1 class="visually-hidden" id="papers-title">Papers with Code</h1>

      <section class="content-section" aria-label="GeoAI papers with code cards">
        <div class="resource-controls paper-controls" data-resource-list data-resource-src="../data/papers.json?v=20260612-7">
          <label class="search-control">
            <span class="visually-hidden">Search papers with code</span>
            <input type="search" placeholder="Search papers with code" data-resource-search />
          </label>
          <label class="filter-control">
            <span class="visually-hidden">Filter papers with code by venue</span>
            <select data-venue-filter>
              <option value="">All venues</option>
            </select>
          </label>
        </div>
        <div class="resource-table-wrap">
          <table class="resource-table resource-table-papers">
            <thead>
              <tr>
                <th scope="col" data-field="title">Paper with Code title</th>
                <th scope="col" data-field="venueYear">Venue / Year</th>
                <th scope="col" data-field="sourceUrl" data-link-field="true">View paper card</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
      </section>
    </main>
    <script src="../js/site.js?v=20260612-8"></script>
  </body>
</html>
