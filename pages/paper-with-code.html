<main class="category-shell catalog-shell catalog-shell-research">
  <section class="research-page-head" aria-label="Paper summary">
    <h1>Papers</h1>
    <p data-paper-summary>Loading paper index</p>
  </section>
  <div class="research-layout">
    <aside class="research-sidebar" aria-label="Paper filters">
      <div class="research-side-group">
        <p class="research-side-title">Quick Filters</p>
        <div class="research-filter-list" data-catalog-filters></div>
      </div>
    </aside>
    <section class="research-main" aria-label="Paper list">
      <section class="catalog-toolbar research-toolbar" aria-label="Catalog controls">
        <label class="research-search">
          <svg class="research-search-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m21 21-4.35-4.35M10.5 18a7.5 7.5 0 1 1 0-15 7.5 7.5 0 0 1 0 15Z" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>

        <div class="research-sort-tabs" data-paper-sort>
          <button type="button" class="is-active" data-sort="trending">trending</button>
          <button type="button" data-sort="newest">newest</button>
          <button type="button" data-sort="cited">most cited</button>

      <div class="catalog-resultbar research-resultbar">
        <span data-catalog-status>Loading results</span>
      </div>
      <section class="catalog-list research-list" data-catalog-list aria-live="polite"></section>
