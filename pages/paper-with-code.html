<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Paper with Code — GeoMind</title>
<link rel="stylesheet" href="../src/styles/landing.css?v=20260527-5">
</head>
<body class="category-page catalog-page" data-catalog="papers">
<nav class="category-nav" aria-label="Breadcrumb">
  <div class="category-crumb">
    <a href="../index.html">GeoMind</a>
    <span>/</span>
    <span>Papers</span>
  </div>
  <div class="category-nav-actions">
    <button class="category-theme-toggle" data-theme-toggle type="button" aria-label="Switch theme">
      <svg class="icon-moon" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M12 4.5a7.5 7.5 0 1 0 7.5 7.5A6.8 6.8 0 0 1 12 4.5Z" fill="currentColor"/></svg>
      <svg class="icon-sun" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M12 7a5 5 0 1 0 0 10 5 5 0 0 0 0-10Zm0-4a1 1 0 0 1 1 1v1.2a1 1 0 1 1-2 0V4a1 1 0 0 1 1-1Zm0 14.8a1 1 0 0 1 1 1V20a1 1 0 1 1-2 0v-1.2a1 1 0 0 1 1-1ZM4 11h1.2a1 1 0 1 1 0 2H4a1 1 0 1 1 0-2Zm14.8 0H20a1 1 0 1 1 0 2h-1.2a1 1 0 1 1 0-2ZM6.3 4.9l.8.8a1 1 0 0 1-1.4 1.4l-.8-.8a1 1 0 1 1 1.4-1.4Zm12 12 .8.8a1 1 0 0 1-1.4 1.4l-.8-.8a1 1 0 0 1 1.4-1.4Zm.8-10.6-.8.8a1 1 0 0 1-1.4-1.4l.8-.8a1 1 0 1 1 1.4 1.4Zm-12 12-.8.8a1 1 0 0 1-1.4-1.4l.8-.8a1 1 0 0 1 1.4 1.4Z" fill="currentColor"/></svg>
    </button>
    <a class="category-nav-map" href="app.html">Open Knowledge Map</a>
  </div>
</nav>
<main class="category-shell catalog-shell catalog-shell-research">
  <section class="catalog-hero">
    <div>
      <p class="category-label" data-catalog-label>Research Index</p>
      <h1 class="category-title" data-catalog-title>Papers</h1>
      <p class="catalog-intro" data-catalog-intro>Loading papers...</p>
    </div>
  </section>
  <div class="research-layout">
    <aside class="research-sidebar" aria-label="Paper filters">
      <div class="research-side-group">
        <p class="research-side-title">Top Domains</p>
        <div class="research-domain-list" data-paper-domains></div>
      </div>
      <div class="research-side-group">
        <p class="research-side-title">Quick Filters</p>
        <div class="research-filter-list" data-catalog-filters></div>
      </div>
    </aside>
    <section class="research-main" aria-label="Paper list">
      <section class="catalog-toolbar research-toolbar" aria-label="Catalog controls">
        <input data-catalog-search type="search" autocomplete="off" spellcheck="false" placeholder="Search papers...">
        <div class="research-sort-tabs" data-paper-sort>
          <button type="button" class="is-active" data-sort="trending">trending</button>
          <button type="button" data-sort="newest">newest</button>
          <button type="button" data-sort="cited">most cited</button>
        </div>
      </section>
      <div class="catalog-resultbar research-resultbar">
        <span data-catalog-status>Loading results</span>
      </div>
      <section class="catalog-list research-list" data-catalog-list aria-live="polite"></section>
      <nav class="catalog-pager research-pager" data-catalog-pager aria-label="Catalog pagination"></nav>
    </section>
  </div>
</main>
<script type="module" src="../src/js/catalog-pages.js?v=20260527-5"></script>
<script type="module" src="../src/js/theme.js"></script>
</body>
</html>
