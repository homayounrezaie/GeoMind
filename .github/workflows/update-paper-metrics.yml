name: Update paper metrics

on:
  schedule:
    - cron: "0 10 */2 * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: paper-metrics
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Update metrics
        env:
          GH_METRICS_TOKEN: ${{ secrets.GH_METRICS_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
          OPENALEX_MAILTO: ${{ secrets.OPENALEX_MAILTO }}
          S2_API_KEY: ${{ secrets.S2_API_KEY }}
        run: >
          python scripts/update_paper_metrics.py
          --papers data/papers.json
          --delay 0.25
          --retries 2
          --rate-limit-wait 60
          --max-retry-wait 180

      - name: Validate JSON
        run: python -m json.tool data/papers.json > /tmp/papers.json

      - name: Commit changes
        run: |
          if git diff --quiet -- data/papers.json; then
            echo "No paper metric changes."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/papers.json
          git commit -m "Update paper metrics"
          git push
